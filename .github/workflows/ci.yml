name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The protocol is meant to be portable, so the reference implementation is
    # tested everywhere CPython runs rather than only on the machine it was
    # written on. Nothing in the test suite touches a radio: the mesh tests use
    # an in-process medium, so this is a genuine cross-platform run.
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Verify against protocol vectors
        run: python tools/verify_vectors.py

  vectors-are-deterministic:
    # Vectors must be reproducible from the generator. A diff here means either
    # the protocol changed (which is a version bump, not a routine commit) or
    # the vectors were hand-edited.
    name: vectors reproduce byte-for-byte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate
        run: python tools/generate_vectors.py

      - name: Fail if the committed vectors changed
        run: |
          if ! git diff --exit-code --stat vectors/; then
            echo ""
            echo "Regenerating the vectors changed them."
            echo "If the protocol changed on purpose, bump the version byte and"
            echo "commit the regenerated vectors. Otherwise this is drift."
            exit 1
          fi
